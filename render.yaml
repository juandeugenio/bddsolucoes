services:
  - type: web
    name: bdd-solucoes
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cd client && npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_HTTPS_REDIRECT
        value: "false"
      - key: PORT
        value: "10000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: PIX_EMAIL
        sync: false
      - key: PIX_COPIA_E_COLA
        sync: false
      - key: CLIENT_DIST
        value: client/dist